services:
  vespa:
    image: vespaengine/vespa:8
    volumes:
      - vespa-data:/opt/vespa/var
      - ./vespa-app:/app:ro
    ports:
      - "8083:8080" # API, убрать в проде
      - "19072:19071" # Config Server, убрать в проде
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:19071/state/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 30
    mem_limit: 4g

  api-gateway:
    image: incident-vectorizer:local
    build: .
    ports: 
      - 8001:8001
    env_file: 
      - ${INCIDENT_ENV_FILE:-.env}
    depends_on:
      vespa:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/v1/ready')"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  vespa-data:
