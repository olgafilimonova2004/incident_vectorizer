[project]
name = "incident-vectorizer"
version = "0.1.0"
description = "Индексация Jira в Vespa"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.8,<3", "pydantic-settings>=2.4,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "dishka>=1.4,<2"]

[dependency-groups]
dev = ["pytest>=8,<9", "ty"]

[project.scripts]
incident-vectorizer = "main:main"
jira-index = "src.cli:index_main"
jira-dump = "src.cli:dump_issue_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"main.py" = "main.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
